<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesotho Ideal Accommodation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            transition: color 1s ease;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        /* Button Styles */
        .btn {
            background-color: green;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            text-transform: uppercase;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: blue;
            color: white;
            transform: scale(1.5);
        }

        /* Navigation Links */
        .nav-links {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: row;
            z-index: 100;
        }

        .nav-links a {
            color: blue;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            margin-left: 20px;
            transition: transform 0.3s ease;
        }

        .nav-links a:hover {
            transform: scale(1.4);
        }

        /* Logo */
        .logo {
            width: 150px; /* Default width */
            max-width: 100%; /* Ensures responsiveness */
            height: auto; /* Maintains aspect ratio */
            margin-bottom: 20px; /* Adjust space below the logo */
            padding: 10px; /* Adds some padding for better appearance */
            display: block;
            z-index: 10; /* Ensures logo is behind navigation links */
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.2)); /* Adds a slight shadow for better visibility */
        }

        /* Menu Button */
        .menu-btn {
            display: none; /* Hide menu button by default */
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Hide nav links on mobile */
                position: absolute;
                top: 20px;
                right: 20px;
                padding: 10px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            .nav-links.active {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
            }

            .nav-links a {
                margin-left: 0;
                margin-bottom: 10px;
            }

            .menu-btn {
                display: block; /* Show menu button on mobile */
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 99;
            }
        }

        /* Social Media Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            position: absolute;
            bottom: 20px; /* Position at the bottom */
        }

        .social-icons a {
            margin: 0 10px;
        }

        .social-icons img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .social-icons img:hover {
            transform: scale(1.5);
        }
    </style>
</head>
<body>

    <!-- Navigation Links -->
    <div class="nav-links">
        <a href="about.html">About Us</a>
        <a href="form.html">Login</a>
        <a href="contact.html">Contact Us</a>
    </div>

    <!-- Menu Button -->
    <button class="menu-btn" onclick="toggleMenu()">Menu</button>

    <!-- Logo Image -->
    <img src="logo.png" alt="Lesotho Ideal Accommodation Logo" class="logo" loading="lazy">

    <!-- Welcome Message -->
    <h1 id="welcome-text"></h1>
    <p style="color: green; font-weight: bold;">Your premier destination for quality rental solutions in Lesotho.</p>
    <a href="form.html" class="btn">Discover More</a>

    <!-- Social Media Icons -->
    <div class="social-icons">
        <a href="https://www.facebook.com" target="_blank">
            <img src="facebook.png" alt="Facebook">
        </a>
        <a href="https://www.twitter.com" target="_blank">
            <img src="twitter.png" alt="Twitter">
        </a>
        <a href="https://www.tiktok.com" target="_blank">
            <img src="tiktok.png" alt="Tiktok">
        <a href="https://www.instagram.com" target="_blank">
            <img src="instagram.png" alt="Instagram">
        </a>
    </div>
    
    <script>
        // Typing effect for the welcome message
        const text = "Welcome To Lesotho Ideal Accommodations.";
        let index = 0;
        let speed = 100; // Typing speed in milliseconds
        let repeatTime = 8000; // Time in milliseconds before repeating

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("welcome-text").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(resetText, repeatTime);
            }
        }

        function resetText() {
            index = 0;
            document.getElementById("welcome-text").innerHTML = "";
            typeWriter();
        }

        // Start typing the welcome message
        typeWriter();

        // Toggle menu function
        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }
    </script>

    <script>
        // Function to change the color of the welcome text every 3 seconds
        const colors = ['#0d98ba', '#097782', '#1135ba', '#0dba1e', '#098215', '#008000', '#0000FF', '#000000']; // white, green, blue, black new ['#0d98ba', '#097782', '#1135ba', '#0dba1e', '#098215']
        let colorIndex = 0;

        setInterval(changeColor, 3000);

        function changeColor() {
            document.getElementById('welcome-text').style.color = colors[colorIndex];
            colorIndex = (colorIndex + 1) % colors.length;
        }
    </script>
</body>
</html>
